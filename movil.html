<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stock">
<meta name="theme-color" content="#3d5a40">
<link rel="apple-touch-icon" href="logo-192.png">
<link rel="icon" href="logo-192.png">
<title>Stock · Giorenatto</title>
<style>
  :root{
    --verde:#3d5a40; --verde-claro:#eef3ea; --tinta:#22301f; --gris:#6b7566;
    --borde:#e2e6de; --rojo:#a83b32; --fondo:#f6f7f4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--fondo);color:var(--tinta);font-size:17px;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .pantalla{min-height:100vh}
  /* ---------- login ---------- */
  #vistaLogin{display:flex;align-items:center;justify-content:center;padding:24px}
  .caja-login{width:100%;max-width:360px;background:#fff;border:1px solid var(--borde);border-radius:18px;padding:26px 22px;text-align:center}
  .caja-login h1{font-size:1.3rem;margin:0 0 4px}
  .caja-login p{color:var(--gris);font-size:.92rem;margin:0 0 20px}
  input[type=password],input[type=search]{
    width:100%;padding:15px 14px;font-size:17px;border:1px solid var(--borde);
    border-radius:12px;background:#fff;color:var(--tinta);font-family:inherit;
  }
  input[type=password]:focus,input[type=search]:focus{outline:2px solid var(--verde);border-color:var(--verde)}
  .btn{
    display:block;width:100%;padding:15px;border:0;border-radius:12px;font-size:17px;
    font-weight:600;font-family:inherit;cursor:pointer;background:var(--verde);color:#fff;
  }
  .btn:active{opacity:.85}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn-claro{background:var(--verde-claro);color:var(--verde)}
  .error{color:var(--rojo);font-size:.88rem;margin:10px 0 0;min-height:1.1em}
  /* ---------- app ---------- */
  header{
    position:sticky;top:0;z-index:10;background:rgba(246,247,244,.96);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--borde);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .barra{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .barra strong{font-size:1.05rem;letter-spacing:.02em}
  .barra .mini{background:none;border:0;color:var(--gris);font-size:.85rem;font-family:inherit;padding:6px 2px;cursor:pointer}
  main{padding:12px 14px 40px}
  .card{
    background:#fff;border:1px solid var(--borde);border-radius:16px;padding:12px;
    margin-bottom:12px;display:flex;gap:12px;
  }
  .card img{width:64px;height:80px;object-fit:cover;border-radius:10px;background:var(--verde-claro);flex:0 0 auto}
  .card .info{flex:1;min-width:0}
  .card h3{margin:0 0 2px;font-size:1rem;font-weight:600;line-height:1.25}
  .card .cat{color:var(--gris);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
  .var{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--borde)}
  .var:first-of-type{border-top:0}
  .var .eti{flex:1;font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pillo{
    font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:999px;
    background:var(--verde-claro);color:var(--verde);flex:0 0 auto;
  }
  .pillo.cero{background:#f3e6e4;color:var(--rojo)}
  .btn-baja{
    flex:0 0 auto;padding:10px 14px;border:0;border-radius:10px;background:var(--verde);
    color:#fff;font-size:.9rem;font-weight:600;font-family:inherit;cursor:pointer;
  }
  .btn-baja:active{opacity:.85}
  .btn-baja[disabled]{background:#e6e8e2;color:#9aa396}
  .vacio{color:var(--gris);text-align:center;padding:40px 20px;font-size:.95rem}
  .nota{color:var(--gris);font-size:.78rem;text-align:center;padding:0 20px 30px;line-height:1.5}
  /* ---------- pestañas ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:10px;background:#eceee8;padding:4px;border-radius:12px}
  .tab{flex:1;padding:10px;border:0;border-radius:9px;background:none;font-family:inherit;font-size:.95rem;font-weight:600;color:var(--gris);cursor:pointer}
  .tab.activo{background:#fff;color:var(--verde);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  /* ---------- ventas ---------- */
  #paneVentas{padding:12px 14px 40px}
  .resumen,.form{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:14px;margin-bottom:12px}
  .resumen h2,.form h2{margin:0 0 2px;font-size:1rem}
  .resumen .fecha{color:var(--gris);font-size:.8rem;margin-bottom:10px}
  .fila{display:flex;justify-content:space-between;padding:5px 0;font-size:.95rem}
  .fila span:first-child{color:var(--gris)}
  .fila b{font-weight:700}
  .fila.grande{border-top:1px solid var(--borde);margin-top:6px;padding-top:9px;font-size:1.05rem}
  .neto.malo{color:var(--rojo)} .neto.bien{color:var(--verde)}
  .campo{margin-bottom:10px}
  .campo label{display:block;font-size:.78rem;color:var(--gris);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
  .campo input,.campo select{width:100%;padding:12px;font-size:16px;border:1px solid var(--borde);border-radius:11px;background:#fff;color:var(--tinta);font-family:inherit}
  .campo input:focus,.campo select:focus{outline:2px solid var(--verde);border-color:var(--verde)}
  .dos{display:flex;gap:10px} .dos .campo{flex:1}
  .check{display:flex;align-items:center;gap:9px;font-size:.88rem;color:var(--tinta);margin:2px 0 12px;line-height:1.3}
  .check input{width:20px;height:20px;flex:0 0 auto}
  .venta{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:11px 12px;margin-bottom:9px}
  .venta .t{font-weight:600;font-size:.95rem;margin-bottom:3px}
  .venta .d{color:var(--gris);font-size:.82rem;margin-bottom:8px}
  .venta .acc{display:flex;gap:8px}
  .venta .acc button{flex:1;padding:9px;border-radius:9px;border:0;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
  .b-editar{background:var(--verde-claro);color:var(--verde)}
  .b-borrar{background:#f3e6e4;color:var(--rojo)}
  /* ---------- costos ---------- */
  .costo{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:9px 11px;margin-bottom:8px}
  .costo .n{flex:1;min-width:0;font-size:.92rem;line-height:1.25}
  .costo .n span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .costo .n small{display:block;color:var(--gris);font-size:.74rem;margin-top:2px}
  .costo input{width:108px;flex:0 0 auto;padding:9px;font-size:16px;border:1px solid var(--borde);border-radius:9px;text-align:right;font-family:inherit;color:var(--tinta);background:#fff}
  .costo input:focus{outline:2px solid var(--verde);border-color:var(--verde)}
  .costo.falta{background:#fdf7f6;border-color:#f0d9d5}
  .aviso-costo{color:var(--gris);font-size:.78rem;margin-top:6px;line-height:1.4}
  .aviso-costo.malo{color:var(--rojo)}
  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(28,36,26,.5);display:flex;align-items:flex-end;z-index:50}
  .modal .hoja{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
  .modal h2{margin:0 0 6px;font-size:1.15rem}
  .modal .det{color:var(--gris);font-size:.95rem;margin-bottom:18px;line-height:1.4}
  .modal .acciones{display:flex;gap:10px}
  .modal .acciones .btn{flex:1}
  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;font-size:.92rem;
    max-width:88vw;text-align:center;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25);line-height:1.35;
  }
  .toast.malo{background:var(--rojo)}
  [hidden]{display:none !important}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="vistaLogin" class="pantalla">
  <div class="caja-login">
    <h1>Stock Giorenatto</h1>
    <p>Ingresá la clave para dar de baja lo que se vende.</p>
    <input id="clave" type="password" inputmode="text" autocomplete="current-password" placeholder="Clave">
    <div class="error" id="errLogin"></div>
    <button class="btn" id="btnEntrar" style="margin-top:14px">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="vistaApp" class="pantalla" hidden>
  <header>
    <div class="barra">
      <strong id="tituloApp">Stock</strong>
      <span>
        <button class="mini" id="btnRefrescar">Actualizar</button>
        <button class="mini" id="btnSalir">Salir</button>
      </span>
    </div>
    <div class="tabs">
      <button class="tab activo" id="tabStock">Stock</button>
      <button class="tab" id="tabVentas">💰 Ventas</button>
      <button class="tab" id="tabCostos">💲 Costos</button>
      <input id="buscar" type="search" placeholder="Buscar prenda…" autocomplete="off">
  </header>
  <main id="lista"></main>
  <div class="nota" id="notaStock">Tocá <strong>“Se vendió”</strong> cuando salga algo del local.<br>Se descuenta acá y en Mercado Libre.</div>

  <div id="paneVentas" hidden>
    <div class="resumen" id="resumen"></div>
    <button class="btn btn-claro" id="btnIrCostos" style="margin-bottom:12px">💲 Cargar los costos de las prendas</button>
    <div class="form">
      <h2>Registrar una venta</h2>
      <div class="campo"><label>Prenda</label><select id="vProducto"></select></div>
      <div class="campo"><label>Talle / color</label><select id="vTalle"></select></div>
      <div class="dos">
        <div class="campo"><label>Cantidad</label><input id="vCant" type="number" inputmode="numeric" min="1" value="1"></div>
        <div class="campo"><label>Me costó ($)</label><input id="vCosto" type="number" inputmode="numeric" min="0" placeholder="Costo"></div>
      </div>
      <div class="campo"><label>A cuánto lo vendí ($)</label><input id="vPrecio" type="number" inputmode="numeric" min="0" placeholder="Precio de venta"></div>
      <label class="check"><input id="vDescontar" type="checkbox" checked> Descontar del stock (web + Mercado Libre)</label>
      <button class="btn" id="btnVenta">Registrar venta</button>
      <div class="error" id="errVenta"></div>
    </div>
    <div id="listaVentas"></div>
  </div>

  <div id="paneCostos" hidden>
    <div class="resumen" id="resumenCostos"></div>
    <input id="buscarCosto" type="search" placeholder="Buscar prenda…" autocomplete="off" style="margin-bottom:12px">
    <div id="listaCostos"></div>
  </div>
</div>

<!-- CONFIRMAR -->
<div id="confirmar" class="modal" hidden>
  <div class="hoja">
    <h2 id="cNombre">—</h2>
    <div class="det" id="cDetalle">—</div>
    <div class="acciones">
      <button class="btn btn-claro" id="btnCancelar">Cancelar</button>
      <button class="btn" id="btnConfirmar">Sí, se vendió</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
(function(){
  "use strict";
  var API = "https://backend-omega-smoky-28.vercel.app";
  var CLAVE_TOKEN = "gio_stock_token";

  var $ = function(id){ return document.getElementById(id); };
  var productos = [];
  var filtro = "";
  var pendiente = null;
  var tmrToast = null;

  function token(){ try { return localStorage.getItem(CLAVE_TOKEN) || ""; } catch(e){ return ""; } }
  function guardarToken(t){ try { localStorage.setItem(CLAVE_TOKEN, t); } catch(e){} }
  function borrarToken(){ try { localStorage.removeItem(CLAVE_TOKEN); } catch(e){} }

  function toast(msg, malo){
    var el = $("toast");
    el.textContent = msg;
    el.className = "toast" + (malo ? " malo" : "");
    el.hidden = false;
    clearTimeout(tmrToast);
    tmrToast = setTimeout(function(){ el.hidden = true; }, 4200);
  }

  // ---------- login ----------
  function entrar(){
    var pass = $("clave").value;
    if(!pass){ $("errLogin").textContent = "Poné la clave"; return; }
    $("btnEntrar").disabled = true;
    $("errLogin").textContent = "";
    fetch(API + "/api/stock/login", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ password: pass })
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        $("btnEntrar").disabled = false;
        if(res.ok && res.j && res.j.token){
          guardarToken(res.j.token);
          $("clave").value = "";
          abrirApp();
        } else {
          $("errLogin").textContent = (res.j && res.j.error) || "No pude entrar";
        }
      })
      .catch(function(){ $("btnEntrar").disabled = false; $("errLogin").textContent = "Sin conexión"; });
  }

  // ---------- pantallas ----------
  function abrirApp(){
    $("vistaLogin").hidden = true;
    $("vistaApp").hidden = false;
    cargar();
  }
  function cerrarSesion(){
    borrarToken();
    $("vistaApp").hidden = true;
    $("vistaLogin").hidden = false;
  }

  // ---------- catálogo ----------
  function cargar(){
    $("lista").innerHTML = '<div class="vacio">Cargando…</div>';
    fetch(API + "/api/stock/lista", { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j || !j.ok){ toast((j && j.error) || "No pude leer el catálogo", true); return; }
        productos = j.productos || [];
        productos.sort(function(a,b){ return (a.nombre||"").localeCompare(b.nombre||"","es"); });
        pintar();
      })
      .catch(function(){ toast("Sin conexión con el servidor", true); });
  }

  function variantes(p){
    var sv = p.stockVar && Object.keys(p.stockVar).length ? p.stockVar : null;
    if(sv){
      return Object.keys(sv).map(function(k){
        var partes = k.split("|");
        var color = partes[0];
        var talle = partes.slice(1).join("|");
        var sep = (color && talle) ? " · " : "";
        return { clave:k, etiqueta:(color + sep + talle) || "Único", stock:Number(sv[k])||0 };
      });
    }
    var talles = (p.talles && p.talles.length) ? p.talles : [p.talle || "Único"];
    return [{ clave:"", etiqueta: talles.join(" / "), stock:Number(p.stock)||0 }];
  }

  function foto(p){
    if(p.img) return p.img;
    if(p.colores && p.colores[0] && p.colores[0].foto) return p.colores[0].foto;
    return "";
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  function pintar(){
    var q = filtro.trim().toLowerCase();
    var lista = productos.filter(function(p){
      if(!q) return true;
      return (p.nombre||"").toLowerCase().indexOf(q) >= 0 || (p.id||"").toLowerCase().indexOf(q) >= 0;
    });
    if(!lista.length){ $("lista").innerHTML = '<div class="vacio">No encontré nada con “' + esc(filtro) + '”.</div>'; return; }

    var html = lista.map(function(p){
      var vs = variantes(p);
      var f = foto(p);
      var vars = vs.map(function(v){
        var sin = v.stock <= 0;
        return '<div class="var">'
          + '<span class="eti">' + esc(v.etiqueta) + '</span>'
          + '<span class="pillo' + (sin?" cero":"") + '">' + (sin ? "agotado" : v.stock) + '</span>'
          + '<button class="btn-baja" ' + (sin?"disabled":"") + ' data-id="' + esc(p.id) + '" data-clave="' + esc(v.clave) + '">Se vendió</button>'
          + '</div>';
      }).join("");
      return '<div class="card">'
        + (f ? '<img src="' + esc(f) + '" alt="" loading="lazy">' : '')
        + '<div class="info"><h3>' + esc(p.nombre) + '</h3><div class="cat">' + esc(p.cat || "") + '</div>' + vars + '</div>'
        + '</div>';
    }).join("");
    $("lista").innerHTML = html;
  }

  // ---------- baja ----------
  function pedirConfirmacion(id, clave){
    var p = productos.filter(function(x){ return x.id === id; })[0];
    if(!p) return;
    var v = variantes(p).filter(function(x){ return x.clave === clave; })[0] || {etiqueta:"", stock:0};
    pendiente = { id:id, clave:clave };
    $("cNombre").textContent = p.nombre;
    $("cDetalle").textContent = (v.etiqueta ? v.etiqueta + " · " : "") + "quedan " + v.stock + " → quedará " + Math.max(0, v.stock-1);
    $("confirmar").hidden = false;
  }

  function darBaja(){
    if(!pendiente) return;
    var id = pendiente.id, clave = pendiente.clave;
    $("confirmar").hidden = true;
    pendiente = null;
    $("lista").querySelectorAll("button").forEach(function(b){ b.disabled = true; });

    fetch(API + "/api/stock/baja", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ token: token(), id: id, clave: clave })
    }).then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j||{}}; }); })
      .then(function(res){
        if(res.status === 401){ borrarToken(); toast("Se venció la sesión — volvé a entrar", true); cerrarSesion(); return; }
        var j = res.j;
        if(!j.ok){ toast(j.error || "No pude dar de baja", true); cargar(); return; }
        // reflejar en pantalla
        var p = productos.filter(function(x){ return x.id === id; })[0];
        if(p){
          if(p.stockVar && p.stockVar[clave] != null){ p.stockVar[clave] = j.quedan; p.stock = Object.keys(p.stockVar).reduce(function(s,k){ return s + (Number(p.stockVar[k])||0); },0); }
          else { p.stock = j.quedan; }
        }
        pintar();
        var extra = "";
        if(j.ml){
          if(j.ml.ok && j.ml.item) extra = " · ML actualizado";
          else if(j.ml.ok && j.ml.aviso) extra = " · " + j.ml.aviso;
          else if(!j.ml.ok && j.ml.error) extra = " · ⚠️ ML: " + j.ml.error;
        }
        toast("Listo. Quedan " + j.quedan + (extra ? extra : ""));
      })
      .catch(function(){ toast("Sin conexión — no se guardó", true); cargar(); });
  }

  // ---------- ventas (plata del día) ----------
  var resumenDia = null, costos = {}, alquiler = 38000, verTab = "stock";

  function dinero(n){
    return "$" + (Math.round(Number(n) || 0)).toLocaleString("es-AR");
  }

  function pintarResumen(){
    var h = (resumenDia && resumenDia.hoy) || {};
    var neto = Number(h.neto) || 0;
    var cant = Number(h.cantidad) || 0, und = Number(h.unidades) || 0;
    $("resumen").innerHTML = ''
      + '<h2>Hoy</h2>'
      + '<div class="fecha">' + esc(h.dia || "") + ' · ' + cant + ' venta' + (cant === 1 ? '' : 's') + ' · ' + und + ' prenda' + (und === 1 ? '' : 's') + '</div>'
      + '<div class="fila"><span>Vendí</span><b>' + dinero(h.facturado) + '</b></div>'
      + '<div class="fila"><span>Me costó</span><b>' + dinero(h.costo) + '</b></div>'
      + '<div class="fila"><span>Ganancia</span><b>' + dinero(h.ganancia) + '</b></div>'
      + '<div class="fila"><span>Alquiler del día</span><b>−' + dinero(h.alquiler) + '</b></div>'
      + '<div class="fila grande"><span>Me quedó</span><b class="neto ' + (neto >= 0 ? 'bien' : 'malo') + '">' + dinero(neto) + '</b></div>';
  }

  function pintarVentas(){
    var vs = (resumenDia && resumenDia.ventas) || [];
    if(!vs.length){ $("listaVentas").innerHTML = '<div class="vacio">Todavía no cargaste ventas hoy.</div>'; return; }
    $("listaVentas").innerHTML = vs.map(function(v){
      return '<div class="venta" data-id="' + esc(v.id) + '">'
        + '<div class="t">' + esc(v.nombre || v.productoId || "Prenda") + (v.talle ? ' · ' + esc(v.talle) : '') + '</div>'
        + '<div class="d">' + (Number(v.cantidad) || 1) + ' × ' + dinero(v.precio) + ' · costó ' + dinero(v.costo) + ' · dejó ' + dinero(v.ganancia) + '</div>'
        + '<div class="acc"><button class="b-editar">Cambiar precio</button><button class="b-borrar">Borrar</button></div>'
        + '</div>';
    }).join("");
  }

  function llenarProductos(){
    var sel = $("vProducto");
    if(!sel) return;
    var actual = sel.value;
    sel.innerHTML = '<option value="">Elegí la prenda…</option>' + productos.map(function(p){
      return '<option value="' + esc(p.id) + '">' + esc(p.nombre) + '</option>';
    }).join("");
    if(actual) sel.value = actual;
    llenarTalles();
  }

  function llenarTalles(){
    var sel = $("vTalle");
    if(!sel) return;
    var id = $("vProducto").value;
    var p = productos.filter(function(x){ return x.id === id; })[0];
    if(!p){ sel.innerHTML = '<option value="">—</option>'; return; }
    var vs = variantes(p);
    sel.innerHTML = vs.map(function(v){
      return '<option value="' + esc(v.clave) + '">' + esc(v.etiqueta || "Único") + '</option>';
    }).join("");
    var c = costos[p.id];
    $("vCosto").value = (c && c.costo) ? c.costo : "";
    $("vPrecio").value = (p.precio != null) ? p.precio : "";
  }

  function cargarVentas(){
    $("resumen").innerHTML = '<div class="vacio">Cargando…</div>';
    fetch(API + "/api/stock/ventas?token=" + encodeURIComponent(token()), { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j || !j.ok){ toast((j && j.error) || "No pude leer las ventas", true); return; }
        resumenDia = j; costos = j.costos || {}; alquiler = j.alquiler || 38000;
        pintarResumen(); pintarVentas(); llenarProductos();
      })
      .catch(function(){ toast("Sin conexión con el servidor", true); });
  }

  function registrarVenta(){
    var id = $("vProducto").value;
    if(!id){ $("errVenta").textContent = "Elegí la prenda"; return; }
    var precio = Number($("vPrecio").value) || 0;
    if(!precio){ $("errVenta").textContent = "Poné a cuánto lo vendiste"; return; }
    var p = productos.filter(function(x){ return x.id === id; })[0];
    $("errVenta").textContent = "";
    $("btnVenta").disabled = true;
    fetch(API + "/api/stock/ventas", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        action: "cargar", token: token(), id: id,
        nombre: p ? p.nombre : "",
        talle: $("vTalle").value || "",
        cantidad: Number($("vCant").value) || 1,
        costo: Number($("vCosto").value) || 0,
        precio: precio,
        descontar: $("vDescontar").checked
      })
    }).then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j||{}}; }); })
      .then(function(res){
        $("btnVenta").disabled = false;
        if(res.status === 401){ borrarToken(); toast("Se venció la sesión — volvé a entrar", true); cerrarSesion(); return; }
        var j = res.j;
        if(!j.ok){ $("errVenta").textContent = j.error || "No pude guardar la venta"; return; }
        resumenDia = j; costos = j.costos || {}; alquiler = j.alquiler || 38000;
        pintarResumen(); pintarVentas(); llenarProductos();
        $("vCant").value = 1;
        var st = j.stock || {};
        var aviso = "", malo = false;
        if(st.intentado){
          if(st.ok){ aviso = " · stock " + st.quedan; cargar(); }
          else { aviso = " · ⚠️ stock: " + (st.error || "no se descontó"); malo = true; }
        }
        toast("Venta cargada" + aviso, malo);
      })
      .catch(function(){ $("btnVenta").disabled = false; toast("Sin conexión — no se guardó", true); });
  }

  function editarVenta(id){
    var v = ((resumenDia && resumenDia.ventas) || []).filter(function(x){ return x.id === id; })[0];
    if(!v) return;
    var nuevo = window.prompt("¿A cuánto lo vendiste? (antes " + dinero(v.precio) + ")", v.precio);
    if(nuevo == null) return;
    var precio = Number(String(nuevo).replace(/[^0-9]/g, ""));
    if(!precio){ toast("Poné un número", true); return; }
    fetch(API + "/api/stock/ventas", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ action: "editar", token: token(), ventaId: id, precio: precio })
    }).then(function(r){ return r.json(); })
      .then(function(j){
        if(!j || !j.ok){ toast((j && j.error) || "No pude cambiar el precio", true); return; }
        resumenDia = j; pintarResumen(); pintarVentas(); toast("Precio actualizado ✓");
      })
      .catch(function(){ toast("Sin conexión", true); });
  }

  function borrarVenta(id){
    if(!window.confirm("¿Borro esta venta del registro?")) return;
    fetch(API + "/api/stock/ventas", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ action: "borrar", token: token(), ventaId: id })
    }).then(function(r){ return r.json(); })
      .then(function(j){
        if(!j || !j.ok){ toast((j && j.error) || "No pude borrar", true); return; }
        resumenDia = j; pintarResumen(); pintarVentas(); toast("Venta borrada");
      })
      .catch(function(){ toast("Sin conexión", true); });
  }

  function mostrarTab(cual){
    verTab = cual;
    $("tabStock").className = "tab" + (cual === "stock" ? " activo" : "");
    $("tabVentas").className = "tab" + (cual === "ventas" ? " activo" : "");
    $("tabCostos").className = "tab" + (cual === "costos" ? " activo" : "");
    $("tituloApp").textContent = (cual === "ventas") ? "Ventas" : (cual === "costos" ? "Costos" : "Stock");
    var esStock = (cual === "stock");
    $("buscar").hidden = !esStock;
    $("lista").hidden = !esStock;
    $("notaStock").hidden = !esStock;
    $("paneVentas").hidden = (cual !== "ventas");
    $("paneCostos").hidden = (cual !== "costos");
    if(cual === "ventas"){
      if(!productos.length) cargar(); else llenarProductos();
      cargarVentas();
    } else if(cual === "costos"){
      if(!productos.length) cargar(); else pintarCostos();
    }
  }

  // ---------- costos (una sola vez por prenda) ----------
  var filtroCosto = "";

  function faltanCostos(){
    return productos.filter(function(p){ var c = costos[p.id]; return !(c && Number(c.costo) > 0); }).length;
  }

  function pintarCostos(){
    var q = filtroCosto.trim().toLowerCase();
    var lista = productos.filter(function(p){
      if(!q) return true;
      return (p.nombre || "").toLowerCase().indexOf(q) >= 0 || (p.id || "").toLowerCase().indexOf(q) >= 0;
    });
    var faltan = faltanCostos();
    var cargados = productos.length - faltan;
    $("resumenCostos").innerHTML = ''
      + '<h2>Costos de las prendas</h2>'
      + '<div class="fecha">Se cargan una sola vez. Con eso, cada venta te calcula la ganancia sola.</div>'
      + '<div class="fila"><span>Cargados</span><b>' + cargados + ' de ' + productos.length + '</b></div>'
      + (faltan ? '<div class="fila"><span>Faltan</span><b class="neto malo">' + faltan + '</b></div>' : '<div class="fila"><span>Estado</span><b class="neto bien">Están todos ✓</b></div>');
    if(!lista.length){ $("listaCostos").innerHTML = '<div class="vacio">No encontré nada con “' + esc(filtroCosto) + '”.</div>'; return; }
    $("listaCostos").innerHTML = lista.map(function(p){
      var c = costos[p.id];
      var v = (c && Number(c.costo) > 0) ? c.costo : "";
      return '<div class="costo' + (v ? '' : ' falta') + '" data-id="' + esc(p.id) + '">'
        + '<div class="n"><span>' + esc(p.nombre) + '</span><small>' + esc(p.id) + (p.precio ? ' · se vende ' + dinero(p.precio) : '') + '</small></div>'
        + '<input type="number" inputmode="numeric" min="0" placeholder="costo" value="' + esc(v) + '">'
        + '</div>';
    }).join("");
  }

  function guardarCosto(el){
    var fila = el.parentNode;
    if(!fila) return;
    var id = fila.getAttribute("data-id");
    var p = productos.filter(function(x){ return x.id === id; })[0];
    var valor = Number(el.value) || 0;
    fetch(API + "/api/stock/ventas", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ action: "costo", token: token(), id: id, nombre: p ? p.nombre : "", costo: valor })
    }).then(function(r){ return r.json(); })
      .then(function(j){
        if(!j || !j.ok){ toast((j && j.error) || "No pude guardar el costo", true); return; }
        costos = j.costos || costos;
        fila.className = "costo" + (valor > 0 ? "" : " falta");
        var faltan = faltanCostos();
        var rc = $("resumenCostos");
        if(rc){
          var partes = rc.querySelectorAll(".fila b");
          if(partes[0]) partes[0].textContent = (productos.length - faltan) + " de " + productos.length;
          if(partes[1]) partes[1].textContent = faltan;
        }
        toast(valor > 0 ? "Costo guardado ✓" : "Costo borrado");
      })
      .catch(function(){ toast("Sin conexión", true); });
  }

  // ---------- eventos ----------

  // ---------- eventos ----------
  $("btnEntrar").addEventListener("click", entrar);
  $("clave").addEventListener("keydown", function(e){ if(e.key === "Enter") entrar(); });
  $("btnSalir").addEventListener("click", cerrarSesion);
  $("btnRefrescar").addEventListener("click", function(){ if(verTab === "ventas"){ cargarVentas(); } else if(verTab === "costos"){ pintarCostos(); } else { cargar(); } });
  $("tabStock").addEventListener("click", function(){ mostrarTab("stock"); });
  $("tabVentas").addEventListener("click", function(){ mostrarTab("ventas"); });
  $("tabCostos").addEventListener("click", function(){ mostrarTab("costos"); });
  $("btnIrCostos").addEventListener("click", function(){ mostrarTab("costos"); });
  $("buscarCosto").addEventListener("input", function(e){ filtroCosto = e.target.value; pintarCostos(); });
  $("listaCostos").addEventListener("change", function(e){
    if(e.target.tagName === "INPUT") guardarCosto(e.target);
  });
  $("vProducto").addEventListener("change", llenarTalles);
  $("btnVenta").addEventListener("click", registrarVenta);
  $("listaVentas").addEventListener("click", function(e){
    var c = e.target.closest(".venta");
    if(!c) return;
    var id = c.getAttribute("data-id");
    if(e.target.closest(".b-editar")) editarVenta(id);
    else if(e.target.closest(".b-borrar")) borrarVenta(id);
  });
  $("buscar").addEventListener("input", function(e){ filtro = e.target.value; pintar(); });
  $("btnCancelar").addEventListener("click", function(){ $("confirmar").hidden = true; pendiente = null; pintar(); });
  $("btnConfirmar").addEventListener("click", darBaja);
  $("lista").addEventListener("click", function(e){
    var b = e.target.closest(".btn-baja");
    if(!b || b.disabled) return;
    pedirConfirmacion(b.getAttribute("data-id"), b.getAttribute("data-clave"));
  });

  // arranque
  if(token()) abrirApp(); else $("vistaLogin").hidden = false;
})();
</script>
</body>
</html>
